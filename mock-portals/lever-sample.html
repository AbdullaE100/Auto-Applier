<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear - Product Infrastructure Engineer Application (Lever)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fcfcfc;
      color: #171717;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      padding: 40px;
    }
    .header {
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .company {
      font-size: 14px;
      font-weight: 600;
      color: #5e6ad2;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 6px 0;
    }
    .section-header {
      font-size: 16px;
      font-weight: 700;
      margin: 24px 0 12px;
      color: #171717;
    }
    .application-question {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #5e6ad2;
      box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.15);
    }
    .submit-btn {
      background-color: #5e6ad2;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="company">Linear Orbit Inc.</div>
    <h1>Product Infrastructure Engineer</h1>
    <p style="color: #666; font-size: 14px;">Remote &bull; Full-time</p>
  </div>

  <form class="application-form" id="application-form" onsubmit="event.preventDefault(); alert('Lever application simulated!');">
    <div class="section-header">Submit your application</div>

    <div class="application-question">
      <label>Full name <span>*</span></label>
      <input type="text" name="name" required placeholder="Jane Doe">
    </div>

    <div class="application-question">
      <label>Email <span>*</span></label>
      <input type="email" name="email" required placeholder="jane@example.com">
    </div>

    <div class="application-question">
      <label>Phone <span>*</span></label>
      <input type="tel" name="phone" required placeholder="(555) 000-0000">
    </div>

    <div class="application-question">
      <label>Current company</label>
      <input type="text" name="org" placeholder="Current Company">
    </div>

    <div class="section-header">Links</div>

    <div class="application-question">
      <label>LinkedIn URL</label>
      <input type="text" name="urls[LinkedIn]" placeholder="https://linkedin.com/in/username">
    </div>

    <div class="application-question">
      <label>GitHub URL</label>
      <input type="text" name="urls[GitHub]" placeholder="https://github.com/username">
    </div>

    <div class="application-question">
      <label>Portfolio / Other website</label>
      <input type="text" name="urls[Portfolio]" placeholder="https://myportfolio.dev">
    </div>

    <div class="section-header">Additional Questions</div>

    <div class="application-question">
      <label>What is a complex engineering problem you solved recently, and how did you measure success?</label>
      <textarea name="comments" rows="5" placeholder="Share your technical problem-solving approach..."></textarea>
    </div>

    <button type="submit" class="submit-btn">Submit Application</button>
  </form>
</div>

<!-- Direct client scripts for test bed -->
<link rel="stylesheet" href="/apps/extension/content/overlay.css">
<script src="/apps/extension/content/autofill-core.js"></script>
<script src="/apps/extension/content/lever.js"></script>
<script src="/apps/extension/content/overlay.js"></script>

</body>
</html>
