<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · JobFlow AI</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="auth-shell">
    <div class="card auth-box">
      <a class="logo" href="index.html"><span class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h8"/><path d="M5 12h13"/><path d="M5 17h5"/><path d="m14.5 8.5 3.5 3.5-3.5 3.5"/></svg></span>JobFlow AI</a>
      <div>
        <h1>Sign in to your dashboard</h1>
        <p class="muted" style="margin-top:6px">Use the same account as your JobFlow extension.</p>
      </div>
      <button class="btn btn-secondary btn-lg btn-block" id="google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or with email</div>
      <form id="email-form" class="field" novalidate>
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" id="send">Email me a sign-in code</button>
      </form>
      <form id="code-form" class="field" hidden novalidate>
        <label for="code">Code from the email</label>
        <input class="input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter code">
        <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" id="verify">Verify & sign in</button>
        <a href="#" id="back" style="font-size:13px;margin-top:6px">Use a different email</a>
      </form>
      <div class="alert alert-error" id="error" hidden></div>
      <p class="subtle" style="font-size:12px">By continuing you agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="assets/client.js"></script>
  <script>
    (async () => {
      const next = new URLSearchParams(location.search).get('next');
      const target = `app.html${next ? `#${encodeURIComponent(next)}` : ''}`;
      const { data } = await sb.auth.getSession();
      if (data.session) return location.replace(target);
      sb.auth.onAuthStateChange((event, session) => { if (session) location.replace(target); });

      const $ = (id) => document.getElementById(id);
      const showError = (m) => { $('error').textContent = m; $('error').hidden = !m; };
      let email = '';

      fetch(`${window.JOBFLOW_CONFIG.supabaseUrl}/auth/v1/settings`, { headers: { apikey: window.JOBFLOW_CONFIG.supabaseAnonKey } })
        .then((r) => r.json())
        .then((st) => { if (!st?.external?.google) { $('google').hidden = true; document.querySelector('.divider').hidden = true; } })
        .catch(() => {});

      $('google').onclick = async () => {
        showError('');
        const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL(target, location.href).href } });
        if (error) showError(error.message);
      };
      $('email-form').onsubmit = async (e) => {
        e.preventDefault();
        email = $('email').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Enter a valid email address.');
        $('send').disabled = true;
        const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
        $('send').disabled = false;
        if (error) return showError(error.message);
        showError('');
        $('email-form').hidden = true;
        $('code-form').hidden = false;
        $('code').focus();
      };
      $('code-form').onsubmit = async (e) => {
        e.preventDefault();
        const token = $('code').value.replace(/\D/g, '');
        if (token.length < 6 || token.length > 8) return showError('Enter the code from the email.');
        $('verify').disabled = true;
        const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
        $('verify').disabled = false;
        if (error) showError('That code is not valid or has expired.');
      };
      $('back').onclick = (e) => { e.preventDefault(); $('email-form').hidden = false; $('code-form').hidden = true; showError(''); };
    })();
  </script>
</body>
</html>
