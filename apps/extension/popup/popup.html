<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFlow AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <span class="brand-name">JobFlow AI</span>
      </div>
      <div id="connection-badge" class="badge badge-success">Connected</div>
    </header>

    <!-- User Profile Card -->
    <div class="card profile-card">
      <div class="user-avatar" id="avatar-initials">--</div>
      <div class="user-info">
        <h3 id="user-name" class="user-name">Loading...</h3>
        <p id="user-email" class="user-email">Connecting to backend...</p>
      </div>
    </div>

    <!-- Usage / Credits Card -->
    <div class="card credits-card">
      <div class="credits-header">
        <span class="card-label">Monthly Applications</span>
        <span id="plan-badge" class="plan-badge">FREE PLAN</span>
      </div>
      <div class="credits-meter">
        <div class="meter-bar">
          <div id="meter-fill" class="meter-fill" style="width: 20%;"></div>
        </div>
        <div class="meter-labels">
          <span id="credits-remaining" class="credits-count">-- left</span>
          <span id="credits-total" class="credits-total">of 10 / mo</span>
        </div>
      </div>
      <a href="http://localhost:3000/dashboard#billing" target="_blank" class="upgrade-btn">
        Upgrade to Pro (Unlimited) &rarr;
      </a>
    </div>

    <!-- Settings & Quick Actions -->
    <div class="settings-group">
      <div class="setting-item">
        <span>AI Answer Open Questions</span>
        <input type="checkbox" id="toggle-ai-answers" checked>
      </div>
      <div class="setting-item">
        <span>Review Before Submit</span>
        <input type="checkbox" id="toggle-review-mode" checked>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <a href="http://localhost:3000/dashboard" target="_blank" class="dashboard-link">
        Open Full Dashboard &rarr;
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
