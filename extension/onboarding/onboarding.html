<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up JobFlow AI</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Setup progress">
      <div class="logo">
        <span class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h8"/><path d="M5 12h13"/><path d="M5 17h5"/><path d="m14.5 8.5 3.5 3.5-3.5 3.5"/></svg></span>
        JobFlow AI
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="rail-foot" id="rail-foot"></div>
    </aside>

    <main class="main">
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="mobile-head">
        <span class="logo"><span class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h8"/><path d="M5 12h13"/><path d="M5 17h5"/><path d="m14.5 8.5 3.5 3.5-3.5 3.5"/></svg></span> JobFlow AI</span>
        <span class="subtle" id="mobile-step"></span>
      </div>
      <section class="panel" id="panel" aria-live="polite"></section>
      <footer class="nav" id="nav"></footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="../config.js"></script>
  <script src="../lib/supabase.js"></script>
  <script src="../lib/mammoth.browser.min.js"></script>
  <script src="../shared/countries.js"></script>
  <script src="../shared/questions.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/client.js"></script>
  <script src="cv-reader.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
